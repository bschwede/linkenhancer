name: Sync Docs
on:
  push:
    branches: [main]
    paths:
      - 'src/Schema/SeedHelpTable.csv'
      - 'src/**/*.php'
      - 'cron-jobs.php'
      - 'util/generate-class-hierarchy.php'
      - 'util/generate-cron-jobs-doc.php'
      - 'util/extract-po-json.mjs'
      - 'util/export-le-i18n.php'
      - 'resources/js/src/le-config.js'
      - 'util/generate-link-params.mjs'
      - 'resources/lang/de.po'
  workflow_dispatch:

jobs:
  sync:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        run: |
          if command -v php >/dev/null 2>&1; then
            php -v | head -1
          else
            if [ "$(id -u)" = "0" ]; then
              DEBIAN_FRONTEND=noninteractive apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends php-cli
            elif command -v sudo >/dev/null 2>&1; then
              sudo env DEBIAN_FRONTEND=noninteractive apt-get update
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends php-cli
            else
              echo "ERROR: not root and sudo not available - cannot install php-cli"
              exit 1
            fi
            php -v | head -1
          fi
      - name: Sync artifacts to wt-modules
        env:
          WT_MODULES_TOKEN: ${{ secrets.WT_MODULES_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0

          if [ -z "${WT_MODULES_TOKEN:-}" ]; then
            echo "ERROR: WT_MODULES_TOKEN is not set in repo secrets - cannot push to wt-modules."
            exit 1
          fi

          CRED_FILE="$RUNNER_TEMP/wt-modules-git-credentials"
          git config --global credential.helper "store --file=$CRED_FILE"
          printf 'protocol=https\nhost=codeberg.org\nusername=x-access-token\npassword=%s\n' \
            "$WT_MODULES_TOKEN" \
            | git credential approve

          git clone --depth 1 https://codeberg.org/bschwede/wt-modules.git /tmp/wt-modules
          mkdir -p /tmp/wt-modules/static/data
          mkdir -p /tmp/wt-modules/content/en/includes/linkenhancer
          mkdir -p /tmp/wt-modules/content/de/includes/linkenhancer

          # --- help-mapping CSV ---
          cp src/Schema/SeedHelpTable.csv /tmp/wt-modules/static/data/help-mapping.csv
          HASH=$(sha256sum src/Schema/SeedHelpTable.csv | cut -c1-12)
          echo "{\"hash\": \"${HASH}\", \"updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > /tmp/wt-modules/static/data/help-mapping.version.json

          # --- npm dep (gettext-parser for PO extraction) ---
          npm install gettext-parser --no-save --ignore-scripts

          # --- DE i18n extraction (raw PO → JSON, prerequisite for DE fragments) ---
          node util/extract-po-json.mjs > util/i18n-de.json

          # --- class-hierarchy fragment (language-neutral, EN + DE) ---
          php util/generate-class-hierarchy.php > /tmp/wt-modules/content/en/includes/linkenhancer/class-hierarchy.md
          cp /tmp/wt-modules/content/en/includes/linkenhancer/class-hierarchy.md /tmp/wt-modules/content/de/includes/linkenhancer/class-hierarchy.md

          # --- cron-jobs reference (EN + DE) ---
          php util/generate-cron-jobs-doc.php > /tmp/wt-modules/content/en/includes/linkenhancer/cron-jobs.md
          php util/generate-cron-jobs-doc.php --lang=de > /tmp/wt-modules/content/de/includes/linkenhancer/cron-jobs.md

          # --- enhanced-links parameter reference (EN + DE) ---
          php util/export-le-i18n.php > util/le-i18n-en.json
          php util/export-le-i18n.php --lang=de > util/le-i18n-de.json
          node util/generate-link-params.mjs > /tmp/wt-modules/content/en/includes/linkenhancer/le-link-parameters.md
          node util/generate-link-params.mjs --lang=de > /tmp/wt-modules/content/de/includes/linkenhancer/le-link-parameters.md

          cd /tmp/wt-modules
          git config user.name "linkenhancer-ci"
          git config user.email "ci@users.noreply.codeberg.org"          
          git add static/data/help-mapping.csv static/data/help-mapping.version.json content/en/includes/linkenhancer/ content/de/includes/linkenhancer/
          if ! git diff --cached --quiet; then
            git commit -m "sync: linkenhancer artifacts $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes - skipping commit"
          fi

          rm -f "$CRED_FILE"
